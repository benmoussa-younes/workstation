[defaults]
roles_path = roles
retry_files_enabled = False
# A converge over SSH must not trust a host key it has never seen; the proof
# host's key is in the controller's known_hosts.
host_key_checking = True
interpreter_python = auto_silent

[privilege_escalation]
become_ask_pass = False

[ssh_connection]
# A single SSH command per task instead of several round trips. Debian's sudo
# does not require a tty, which is the condition for pipelining to work.
pipelining = True
