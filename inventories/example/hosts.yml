---
# Documentation values only: TEST-NET-1 address, no real host, no secret.
# A Wi-Fi passphrase, when needed, comes from `group_vars/all/vault.yml`,
# created from `group_vars/all/vault.yml.example`.
all:
  hosts:
    workstation:
      ansible_host: 192.0.2.10
      ansible_user: operator
      ansible_connection: ssh
      ansible_python_interpreter: /usr/bin/python3
      # The human account the workstation serves. It must exist before this
      # play runs; the product adds its desktop groups and its locale.
      workstation_user: operator
  vars:
    # The product's name on the machine. The server's `identity_product` is
    # refused: a workstation branded as a server is a defect, not a setting.
    identity_product: workstation-gnome
    # The desktop groups the account receives after the GNOME packages create
    # them. The role adds only groups that exist and asserts the critical ones.
    workstation_desktop_groups:
      - audio
      - video
      - render
      - input
      - netdev
      - bluetooth
      - cdrom
      - plugdev
      # GNOME Logs reads the journal through this group.
      - systemd-journal
    workstation_locale: fr_FR.UTF-8
    workstation_locale_language: fr_FR:fr
    # Optional developer tool groups. Empty installs none; the names are the
    # catalogue in roles/developer/defaults/main.yml. The dotnet group adds
    # Microsoft's official .NET 10 repository for dotnet-sdk-10.0.
    developer_tools:
      - build
      - debug
      - clang
      - dotnet
      - search
      - lint
      - ansible
      - database
      - python
      - network
      - packaging
      - bench
      - test
      - shell
      - docs
      - jre
    # The opt-in gaming stack. False installs nothing. True requires Debian
    # `contrib` and the i386 architecture on the site's package sources.
    gaming_enabled: false
    # The optional local virtualization stack: libvirt/virt-manager and
    # rootless Podman. False installs nothing; no VM or container is created.
    virtualization_enabled: false
    virtualization_user: "{{ workstation_user }}"
    virtualization_podman_enabled: true
    # The console keyboard, shared with GDM.
    keyboard_layout: fr
    # The declared timezone and the only time source. The product uses no
    # public fallback unless the site declares one.
    time_timezone: Etc/UTC
    time_client_fallback_pools:
      - 2.debian.pool.ntp.org
    # The site's stub resolver. Empty means "the link's servers"; a declared
    # filtering resolver is written to `DNS=` with DoT when asked.
    resolver_dns_over_tls: false
    resolver_dnssec: allow-downgrade
    # A Wi-Fi site that hands the link over by hand sets this false: the
    # NetworkManager profile is the site's, and the role only verifies it.
    # A host whose link is still systemd-networkd keeps the default true.
    network_profile_managed: true
    # A declared static address for the boot keyfile. Empty carries the address
    # the host already has. Both or neither: the product never invents a default
    # route, and a manual link with neither a link DNS nor a fallback is refused
    # before the reboot. The Wi-Fi passphrase is read from the site's vault
    # (`network_wifi_ssid`/`network_wifi_psk`) or from the installer's files, and
    # is stored derived, never in clear.
    network_boot_address: ""
    network_boot_gateway: ""
    network_boot_dns: []
    # Only a host that shows the two udev warnings of Debian #1093057 sets this
    # true; the workaround rewrites the ALSA restore rule in `/etc/udev/rules.d`.
    audio_fix_alsa_restore: false
    # A declared address is proved by the boot that uses it. True reboots the
    # machine when the link is handed to NetworkManager, reconnects at
    # `network_boot_address` and fails on a DHCP lease. False never reboots.
    workstation_reboot_after: false
    # A console shell that survives a desktop that does not start. Set false on
    # a workstation whose serial line is reachable by other people.
    hardening_console_autologin: false
