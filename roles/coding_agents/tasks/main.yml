---
# The coding agents, installed for the human account the workstation serves.
#
# The installer is the vendor's own script, run as the account at the vendor's
# latest release. Nothing here writes a model, a provider, a secret or a
# configuration file: those are the account's. The only path the role writes is
# the installer's own `$HOME/.opencode/bin`, with its compatibility shim.

- name: The account the coding agents serve is named
  ansible.builtin.assert:
    that:
      - coding_agents_user | length > 0
    fail_msg: >-
      Declare `workstation_user` (or `coding_agents_user`): the coding agents
      are installed for a human account, and the product never creates one.

- name: The account's record is read
  ansible.builtin.getent:
    database: passwd
    key: "{{ coding_agents_user }}"
    fail_key: true

- name: The account's home is decided
  ansible.builtin.set_fact:
    coding_agents_home: >-
      {{ coding_agents_home if coding_agents_home | length > 0
         else ansible_facts['getent_passwd'][coding_agents_user][4] }}

- name: The account's home exists
  ansible.builtin.stat:
    path: "{{ coding_agents_home }}"
  register: coding_agents_home_stat

- name: The account has a home directory
  ansible.builtin.assert:
    that:
      - coding_agents_home_stat.stat.isdir | default(false)
    fail_msg: >-
      {{ inventory_hostname }}: `{{ coding_agents_user }}` has
      `{{ coding_agents_home }}` as its home, and it is not a directory.

- name: The tools the installer needs are present
  ansible.builtin.shell:  # noqa: command-instead-of-shell
    cmd: command -v {{ item }}
  loop: "{{ coding_agents_required_commands }}"
  register: coding_agents_tools
  changed_when: false
  failed_when: false

- name: The installer has its tools
  ansible.builtin.assert:
    that:
      - coding_agents_tools.results | rejectattr('rc', 'equalto', 0) | list | length == 0
    fail_msg: >-
      {{ inventory_hostname }} lacks
      {{ coding_agents_tools.results | rejectattr('rc', 'equalto', 0)
         | map(attribute='item') | list }}. The OpenCode installer needs them;
      the `common` role declares the packages that provide them.

# The previous release owned a machine-wide configuration and a PATH drop-in.
# 0.5.0 retires them: OpenCode reads the account's own configuration, and the
# account owns its PATH. The skills directory under `/etc/opencode` is never
# named here.
- name: The machine-wide files the previous release wrote are removed
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/opencode/opencode.json
    - /etc/profile.d/10-opencode.sh
  when: coding_agents_opencode_enabled | bool

# One task, not three: Ansible's `changed_when` only sees the result of the task
# it belongs to, so the version read before the installer and the one read after
# must be compared here. The installer runs on every converge; the role reports
# changed only when the installed version moves. The binary creates its own XDG
# directories even for `--version`, so both reads use a scratch directory: the
# account's `~/.config/opencode` stays untouched.
- name: OpenCode is installed at the vendor's latest release
  ansible.builtin.shell:  # noqa: command-instead-of-shell
    cmd: |
      set -o pipefail
      scratch="$(mktemp -d "${TMPDIR:-/tmp}/opencode-converge-XXXXXX")" || exit 1
      trap 'rm -rf "$scratch"' EXIT
      export XDG_CONFIG_HOME="$scratch/config"
      export XDG_CACHE_HOME="$scratch/cache"
      export XDG_DATA_HOME="$scratch/data"
      export XDG_STATE_HOME="$scratch/state"
      before="$({{ coding_agents_opencode_bin | quote }} --version 2>/dev/null || true)"
      curl -fsSL {{ coding_agents_opencode_install_url | quote }} \
        | /bin/bash -s -- --no-modify-path
      installer_rc=$?
      after="$({{ coding_agents_opencode_bin | quote }} --version 2>/dev/null || true)"
      printf 'before: %s\nafter: %s\n' "${before:-absent}" "${after:-absent}"
      [ "$installer_rc" -eq 0 ] || exit "$installer_rc"
      if [ "$before" = "$after" ]; then
        printf 'changed=false\n'
      else
        printf 'changed=true\n'
      fi
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ coding_agents_user }}"
  environment:
    HOME: "{{ coding_agents_home }}"
    SHELL: /bin/bash
    # The installer's own `check_version` runs any `opencode` it finds on PATH;
    # an existing binary would create its XDG directories in the home before
    # the new one is installed. A fixed PATH confines the installer to the
    # commands it actually needs.
    PATH: /usr/bin:/bin
  register: coding_agents_opencode_install
  changed_when: "'changed=true' in coding_agents_opencode_install.stdout"
  when:
    - coding_agents_opencode_enabled | bool
    - not ansible_check_mode

# The binary creates its own XDG directories even for `--version`. A scratch
# directory under the system temporary directory keeps the account's
# `~/.config/opencode` untouched by the read-back.
- name: The installed OpenCode answers
  ansible.builtin.shell:  # noqa: command-instead-of-shell
    cmd: |
      scratch="$(mktemp -d "${TMPDIR:-/tmp}/opencode-version-XXXXXX")" || exit 1
      trap 'rm -rf "$scratch"' EXIT
      XDG_CONFIG_HOME="$scratch/config" \
      XDG_CACHE_HOME="$scratch/cache" \
      XDG_DATA_HOME="$scratch/data" \
      XDG_STATE_HOME="$scratch/state" \
        "{{ coding_agents_opencode_bin }}" --version
  args:
    executable: /bin/bash
  register: coding_agents_opencode_running
  changed_when: false
  failed_when: false
  become: true
  become_user: "{{ coding_agents_user }}"
  environment:
    HOME: "{{ coding_agents_home }}"
  when:
    - coding_agents_opencode_enabled | bool
    - not ansible_check_mode

- name: OpenCode is installed and runs
  ansible.builtin.assert:
    that:
      - coding_agents_opencode_running.rc == 0
      - coding_agents_opencode_running.stdout | trim | length > 0
    fail_msg: >-
      {{ inventory_hostname }}: `{{ coding_agents_opencode_bin }} --version`
      answered rc={{ coding_agents_opencode_running.rc | default('?') }}
      `{{ coding_agents_opencode_running.stdout | default('') | trim }}`
      `{{ coding_agents_opencode_running.stderr | default('') | trim }}`.
      The installer needs `{{ coding_agents_opencode_install_url }}`,
      `opencode.ai` and `registry.npmjs.org`.
  when:
    - coding_agents_opencode_enabled | bool
    - not ansible_check_mode
