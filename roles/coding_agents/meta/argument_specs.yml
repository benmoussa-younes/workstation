---
argument_specs:
  main:
    short_description: The coding agents installed for the human account.
    description:
      - >-
        Installs OpenCode at the vendor's latest release
        (`https://opencode.ai/v2/install`) for `coding_agents_user`, as that
        account, with `--no-modify-path`. The installer is not pinned: it
        resolves the upstream release and writes only `$HOME/.opencode/bin`
        (the binary and its compatibility shim). The install step reports
        changed only when the installed version moves; the one-time removal of
        the 0.4.x files is reported once.
      - >-
        The role writes no configuration file and no PATH drop-in. The account
        owns `~/.config/opencode`, its shell files and its PATH;
        `/etc/opencode/skills` is never touched. The machine-wide
        `/etc/opencode/opencode.json` and `/etc/profile.d/10-opencode.sh` the
        previous release wrote are removed when the role is enabled.
      - >-
        The installer needs `curl` and `tar` (the `common` role provides them)
        and network access to `opencode.ai` and `registry.npmjs.org`.
    author: Younes BENMOUSSA
    options:
      coding_agents_user:
        type: str
        required: false
        description: >-
          The account the agents are installed for. Defaults to
          `workstation_user`; an empty value fails the run.
      coding_agents_home:
        type: str
        required: false
        description: >-
          The account's home. Empty reads it from the account record
          (`getent passwd`) instead of guessing a path from the account name.
      coding_agents_opencode_enabled:
        type: bool
        required: false
        description: >-
          Whether OpenCode is installed at all. False by default: the installer
          is a vendor script at its latest release, so a site opts in
          explicitly.
      coding_agents_opencode_install_url:
        type: str
        required: false
        description: The vendor's installer URL.
      coding_agents_opencode_bin_dir:
        type: str
        required: false
        description: >-
          Where the installer writes the binary: `$HOME/.opencode/bin`, the
          path its script uses.
      coding_agents_opencode_bin:
        type: str
        required: false
        description: The installed binary the role reads back.
      coding_agents_required_commands:
        type: list
        elements: str
        required: false
        description: The commands the installer needs; the role asserts them.
