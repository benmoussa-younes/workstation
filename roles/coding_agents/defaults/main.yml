---
# The coding agents the workstation serves, installed for the human account.
#
# OpenCode is the studio's agent harness. Its official installer is a script:
# `curl -fsSL https://opencode.ai/v2/install | bash`. Run as the account with
# `--no-modify-path`, it resolves the vendor's latest release, writes
# `$HOME/.opencode/bin/opencode` (and the `opencode2` compatibility shim) and
# edits no shell rc file. The role installs that latest release on every
# converge and writes nothing else: the configuration, the model, the
# credentials and the PATH belong to the account.
#
# The installer is deliberately not pinned: the owner accepts the vendor's
# latest release without a checksum. The role reports a change only when the
# installed version moves, so a second converge with no new release prints
# `changed=0`.

coding_agents_user: "{{ workstation_user | default('') }}"

# Empty means "the home the account record names"; the role reads it with
# `getent passwd` rather than guessing a path from the account name.
coding_agents_home: ""

# Opt-in. Enabling it runs the vendor's installer as the account, at the
# vendor's latest release and without a checksum; everything the installer does
# not write itself stays the account's.
coding_agents_opencode_enabled: false
coding_agents_opencode_install_url: https://opencode.ai/v2/install
coding_agents_opencode_bin_dir: "{{ coding_agents_home }}/.opencode/bin"
coding_agents_opencode_bin: "{{ coding_agents_opencode_bin_dir }}/opencode"

# The commands the installer needs. `common` already declares the packages that
# provide them; the role asserts rather than re-installs, so a host without the
# baseline fails here with a message that names the missing command.
coding_agents_required_commands:
  - curl
  - tar
