---
argument_specs:
  main:
    short_description: CUPS, the print scheduler, the virtual PDF queue and the network printer discovery.
    description:
      - >-
        Installs CUPS, `avahi-daemon` and `printer-driver-cups-pdf` (Debian's
        binary package name; `cups-pdf` is only the source package in the
        current Debian release), enables and starts the scheduler, creates the
        declared PDF queue with the declared PPD and options when it is absent,
        and reads the scheduler, the queue's state and its device URI back. The
        human account is added to CUPS's `lpadmin` group. The network printers
        are discovered by the GNOME Add Printer panel through Avahi and the
        CUPS `dnssd` backend (the `common` and `security` roles keep the daemon
        and mDNS live); no printer is declared here and the legacy
        `cups-browsed` stays purged.
    author: Younes BENMOUSSA
    options:
      printing_packages:
        type: list
        elements: str
        required: false
        description: The CUPS packages; the full list is in `defaults/main.yml`.
      printing_service:
        type: str
        required: false
        description: The print scheduler's systemd unit.
      printing_admin_user:
        type: str
        required: false
        description: >-
          The human account added to `printing_admin_group` after CUPS creates
          it; it defaults to `workstation_user` and an empty value leaves the
          groups alone.
      printing_admin_group:
        type: str
        required: false
        description: The CUPS admin group (Debian's `SystemGroup`).
      printing_manage_pdf_queue:
        type: bool
        required: false
        description: >-
          Whether the PDF queue is declared. False leaves an existing printing
          configuration untouched and skips every queue task.
      printing_pdf_queue:
        type: str
        required: false
        description: The queue's name.
      printing_pdf_device:
        type: str
        required: false
        description: The queue's device URI (the CUPS-PDF backend).
      printing_pdf_ppd:
        type: str
        required: false
        description: >-
          The PPD file the queue uses, by absolute path. It is passed with
          `lpadmin -P`, which takes a file; `-m` takes a model name from CUPS's
          model directory, where this PPD is not.
      printing_pdf_options:
        type: list
        elements: str
        required: false
        description: >-
          The queue's server-side defaults, as `name=value`, each passed as
          `-o name=value` at creation.
      printing_scheduler_retries:
        type: int
        required: false
        description: How many times to ask the scheduler whether it is running.
      printing_scheduler_delay:
        type: int
        required: false
        description: Seconds between those attempts.
