---
- name: Apply the kernel settings
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: true
  when: not ansible_check_mode

# `augenrules --load` merges rules.d into /etc/audit/audit.rules and loads it:
# the same thing Debian's audit-rules.service does at boot.
#
# `--load` only DELETE on the very first rule of the merged file. A host that
# already has a ruleset in force -- installed by another tool, or by an earlier
# layout of this role -- therefore receives the new rules ON TOP of the old
# ones, and any rule present twice fails with "Rule exists". The load is
# therefore preceded by an explicit flush: the declaration in rules.d is the
# whole policy, so nothing that is not in it may survive.
# The rules end with `-e 2`: once loaded, they are immutable until the next
# boot. `auditctl -D` and `augenrules --load` are refused in that state, so the
# handler reads `auditctl -s` and only reconciles a mutable ruleset. A changed
# rule set on an immutable host is applied by the next boot, not by a converge.
- name: The audit state is read before the clear
  ansible.builtin.command:
    cmd: /usr/sbin/auditctl -s
  register: hardening_audit_state_before
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: The loaded ruleset is cleared before the declaration is applied
  ansible.builtin.command:
    cmd: /usr/sbin/auditctl -D
  changed_when: false
  when:
    - not ansible_check_mode
    - "'enabled 2' not in (hardening_audit_state_before.stdout | default(''))"

- name: Reload the audit rules
  ansible.builtin.command:
    cmd: /usr/sbin/augenrules --load
  changed_when: true
  when:
    - not ansible_check_mode
    - "'enabled 2' not in (hardening_audit_state_before.stdout | default(''))"
  # The clear handler is defined before this one, so it runs first: a flush
  # that is declared but never notified leaves duplicate rules in force.
  notify: The loaded ruleset is cleared before the declaration is applied

- name: Restart auditd
  ansible.builtin.systemd_service:
    name: auditd
    state: restarted
  # In check mode the package install above is only SIMULATED, so the unit
  # does not exist yet: naming it fails the dry run (measured on the proof host,
  # 2026-10-21).
  when: not ansible_check_mode

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: not ansible_check_mode

- name: Restart the disk monitor
  ansible.builtin.systemd_service:
    name: smartd
    state: restarted
  # Same reason as `auditd`: the package that provides the unit is installed by
  # another role, and in check mode that install is only SIMULATED.
  when: not ansible_check_mode

- name: Update grub
  ansible.builtin.command:  # noqa: command-instead-of-module
    cmd: /usr/sbin/update-grub
  changed_when: true
  when: not ansible_check_mode
