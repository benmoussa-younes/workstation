#
# `smartd` is the disk monitor the base already installs; this role decides what
# it asks for. The distribution's `/etc/smartd.conf` is `DEVICESCAN` with no
# test schedule, so a disk is watched for its current attributes and never
# exercised: a sector that fails quietly is only seen once it is read again.
#
# `DEVICESCAN` stays first: it makes every disk known, including one added after
# this file was written, and a directive below it applies to the scans above.
# `-n standby` keeps the probe from waking a sleeping disk, `-s L/../../7/03`
# schedules the LONG self-test weekly at 03:00 on Sunday, and `-M exec` hands
# the failure to the runner Debian ships -- which logs, and mails nobody: this
# product has no mail path.
#
# The day of the week is a DIGIT, 1 (Monday) to 7 (Sunday), and every other
# field is two digits: `smartd` matches the literal string `T/MM/DD/d/HH`
# against a regular expression, so `sun` never matches and a bare `3` (instead
# of `03`) never matches either.
# `smartd -q onecheck -d` reports both as "looks odd" (measured on the proof host,
# 2026-10-22).
#
# Weekly, not quarterly: a long self-test is a background read of the whole
# surface, which on a 512 GB NVMe is minutes, and the earlier a dying disk is
# named the cheaper it is to replace. `-m root` names the recipient the runner
# would use if a site ever provides an MTA.
DEVICESCAN -d removable -n standby -m root -M exec /usr/share/smartmontools/smartd-runner -s L/../../7/03
