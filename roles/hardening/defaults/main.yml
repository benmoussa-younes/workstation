---
# Kernel and system policy. Every value here is a declaration: the audit found
# these at their Debian defaults, which is the same as nobody having decided.
hardening_sysctl_file: /etc/sysctl.d/60-hardening.conf

# Files in `sysctl.d` the site declares and the product does not ship. Anything
# else in that directory that no package owns is retired, because `sysctl
# --system` reads the directory in name order and an undeclared file would win a
# key silently. A network tuning (bbr, buffers) is such a site declaration.
hardening_sysctl_kept: []

# Whether `kexec` stays disabled. True on a base machine, FALSE on a host that
# runs kdump: kdump loads its crash kernel through kexec, and disabling the call
# breaks it -- silently, until the crash that needed it.
hardening_kexec_load_disabled: true

# Where a core goes. `|/bin/false` discards it, which is the product default: a
# core in a predictable path is a memory-disclosure gift. A site that debugs a
# service declares the system collector instead, and accepts the disk cost.
hardening_core_pattern: "|/bin/false"

# What happens on a kernel panic: reboot after N seconds, and print enough before
# it to make the reboot diagnosable. Without `panic_print`, an automatic reboot
# erases the only evidence of why it happened.
hardening_panic_seconds: 30
hardening_panic_print: "0x1b"

# `oops_limit` reboots on a real BUG (an oops), `warn_limit=0` keeps a WARN
# from doing it: firmware and drivers emit WARNs that are not faults, and
# turning them into reboots is how a healthy host enters a boot loop.
hardening_oops_limit: 1
hardening_warn_limit: 0

# The magic SysRq key. 176 = sync + unmount + reboot, the emergency escape on a
# host reachable only over the network. The audit asked for 0; 0 also removes
# the ability to cleanly reboot a hung machine, which is a real cost on a
# self-hosted site. Set 0 to take the stricter reading.
hardening_sysrq: 176

# A headless server has no use for a graphical target; a desktop host does. The
# site declares which, and the check holds each host to its own answer. On this
# product the value is `graphical.target`: the server's inventory must already
# set it, and `playbooks/site.yml` refuses a host that does not.
hardening_default_target: graphical.target

# Subsystems a desktop does not use, prevented from loading at all. `install …
# /bin/false` is stronger than `blacklist`, which only stops udev auto-loading.
hardening_modules_blocked:
  - dccp
  - sctp
  - rds
  - tipc
  - firewire-core
  - cramfs
  - freevxfs
  - hfs
  - hfsplus
  - jffs2
  - udf

# Modules the kernel may request by itself, through udev's modalias probe, on
# hardware this machine still has. A refusal would only log an error for a
# device nothing will use; a blacklist makes the probe find nothing and stay
# quiet. A machine with no such hardware loads nothing anyway.
#
# Bluetooth is NOT here on this product: the GNOME panel drives the radio through
# `bluetoothd`, and the server's entry for `bluetooth`, `btusb` and `btintel`
# was removed with it (a deliberate divergence from the Server collection). The `bt*` transports that
# only the removed controllers need (`btrtl`, `btbcm`, `btmtk`) stay blacklisted.
# `bnep` (Bluetooth PAN) stays too: a desktop does not use it. `rfcomm` is NOT
# blacklisted: BlueZ uses it for HFP, SAP and OBEX, and without it `bluetoothd`
# logs a failed RFCOMM server on every boot. A2DP uses L2CAP and is unaffected.
#
# The `iptables` family is deliberately NOT here, in either list. A host here
# firewalls with nftables, so `ip_tables` and its dependants are loaded by
# nothing -- and `install … /bin/false` on them made `systemd` log "Error
# running install command '/bin/false' for module ip_tables" at every boot
# (measured on the proof host, 2026-10-22), because systemd PROBES modules and a
# refusal looks like a failure. The intent behind that refusal was a scanner's
# clean report, not a security property: `ip_tables` is loaded with no rule in
# it and reported by `lynis` as FIRE-4512 only when something loads it. If a
# host ever needs the block, `install … /bin/true` refuses the module AND
# reports success, which is the one form that does not write an error.
hardening_modules_blacklisted:
  - btrtl
  - btbcm
  - btmtk
  - bnep

# The audit trail (base-roles.md, hardening item 7): the audit found `auditd`
# absent; the package was installed but left with Debian's EMPTY ruleset -- a
# daemon that logs PAM session events and audits nothing else. This role
# declares the rules this product wants.
#
# The rules land in `rules.d`, which `augenrules` merges into
# `/etc/audit/audit.rules` (Debian's default file carries the control
# directives: `-D`, `-b`, `--backlog_wait_time`, `-f`). This product's file holds
# EVENT rules only -- no `-D`, no `-e 2`: `-e 2` makes the ruleset immutable
# until reboot and would break this role's own reload on the next converge.
hardening_audit_rules_file: /etc/audit/rules.d/60-hardening.rules

# The log bound, declared rather than inherited (Debian's default is 8 MB x 5).
# The actions (`space_left_action`, `disk_full_action`) stay Debian's.
hardening_audit_conf: /etc/audit/auditd.conf
hardening_audit_max_log_file: 50
hardening_audit_num_logs: 5
hardening_audit_max_log_file_action: ROTATE

# The console autologin. False by default. True gives the serial console a root
# shell that survives a desktop that cannot start -- the difference between a
# black screen and a prompt on a machine two rooms away. It is a SITE decision:
# a workstation behind a locked door and one in a shared office are not the same
# machine. Only honoured for `hardening_default_target: graphical.target`.
hardening_console_autologin: false
# The serial device the getty serves. It names the unit
# `serial-getty@<device>.service`, so it is the bare device (`ttyS0`); the
# baud list belongs in the override's `ExecStart`, not in this name.
hardening_console_autologin_term: ttyS0
hardening_console_autologin_unit: "serial-getty@{{ hardening_console_autologin_term }}.service"

# The reboot policy: a security kernel may be installed, and this role's own
# check signals a required reboot (`/run/reboot-required`) and logs it once per
# new kernel in the journal. It is installed only where Debian's
# `unattended-upgrades` does not already own that file (see tasks/main.yml):
# two writers of one flag would hide the package list of the other.
#
# Neither writer reboots anything: the operator does, in a maintenance window.
hardening_reboot_check_script: /usr/local/sbin/workstation-reboot-check

# The post-upgrade restart policy. `needrestart` runs at
# the end of an apt upgrade; `restart='a'` restarts the services that loaded an
# upgraded library, so a security fix actually takes effect. Kernel hints are
# OFF: the product signals the kernel reboot itself, one owner.
hardening_needrestart_conf: /etc/needrestart/conf.d/50-workstation.conf

# The AppArmor profile that confines an unprivileged user namespace (decision
# 0026). Debian ships it in complain mode; the role ENFORCES it with
# `aa-enforce` (`apparmor-utils`, installed by `common`).
hardening_userns_profile: /etc/apparmor.d/unprivileged_userns
hardening_userns_tool: /usr/sbin/aa-enforce

# Mount hardening. `/tmp` and `/dev/shm` are world-writable, so
# nothing there may be executed. `/home` a distinct mount is a partitioning
# decision (the storage subject, T6).
#
# `hardening_tmp_mount_options` are TMPFS options (`mode=`, `size=`,
# `nr_inodes=` exist on tmpfs only). They are the fallback for a tmpfs `/tmp`
# with no fstab entry; when `/tmp` is declared in fstab, the drop-in carries that
# entry's options plus `nosuid,nodev`, so the site's size and mode are preserved.
# On a disk filesystem the role keeps the declared (or, absent an fstab entry,
# the live) options and adds `nosuid,nodev`: writing tmpfs options on ext4 failed
# the mount, and with it `local-fs.target`, and sent the proof host to emergency
# mode at boot (measured 2026-10-21). The live mount is never the source when
# fstab declares the mount: the kernel reorders options after the drop-in
# applies, which made the file change once per boot.
#
# `/tmp` is NOT `noexec`. The desktop runs tools that stage and execute helpers
# under `/tmp` (the studio's agent harness among them), and a noexec `/tmp`
# broke them (reported on the desktop site, 2026-11-11). `nosuid,nodev` stay;
# `/dev/shm` keeps `noexec`.
hardening_tmp_mount_dropin: /etc/systemd/system/tmp.mount.d/10-workstation.conf
hardening_tmp_mount_options: "mode=1777,strictatime,nosuid,nodev,size=50%,nr_inodes=1m"
hardening_shm_mount_options: "rw,nosuid,nodev,noexec"

# Resource limits. A declared BASE; per-service limits (a
# database, a proxy) belong to their own roles -- the base does not guess a
# MemoryMax for a service it does not run.
hardening_limits_file: /etc/security/limits.d/50-workstation.conf
hardening_limits_nofile: 65536
hardening_limits_nproc: 16384
hardening_system_limits_file: /etc/systemd/system.conf.d/50-workstation.conf

# The disk monitor's own configuration. The base installs `smartmontools`; this
# role declares what `smartd` asks for, because the distribution's file scans the
# disks and schedules no test: a disk whose access pattern never touches a bad
# sector is reported healthy until the day it is read.
# Whether the product owns the smartd conffile. The file is a package conffile,
# and a client with its own device list must keep it: false leaves it untouched.
# True installs the product's weekly long self-test schedule and replaces the
# file; that is a declared ownership choice, not a silent overwrite.
hardening_smartd_manage: false
hardening_smartd_conf: /etc/smartd.conf

# The kernel command line, declared here and effective at the
# next reboot. `init_on_free` is deliberately NOT set: `init_on_alloc` already
# covers the common case and `init_on_free` has a real cost.
#
# The desktop options: `splash` hands the screen from the bootloader to Plymouth
# (the `plymouth` role installs its theme), `quiet` and `loglevel=3` keep the
# kernel's own chatter off the splash, and `nowatchdog` reclaims the two per-CPU
# watchdog threads a workstation never reads.
hardening_grub_default: /etc/default/grub

# Debian's menu generator appends ` GNU/Linux` to every title it builds from
# `GRUB_DISTRIBUTOR`. The product's menu is its brand, not a distribution label,
# and this is how the server product has always done it: the literal line is
# replaced on every converge and `update-grub` rebuilds the title. The script is
# Debian's conffile, so a `grub-common` upgrade may restore the line; the
# read-back below then fails loudly instead of leaving the suffix in place.
hardening_grub_script: /etc/grub.d/10_linux

hardening_kernel_cmdline:
  - "panic={{ hardening_panic_seconds }}"
  - "panic_print={{ hardening_panic_print }}"
  - slab_nomerge
  - init_on_alloc=1
  - page_alloc.shuffle=1
  - randomize_kstack_offset=on
  - splash
  - quiet
  - loglevel=3
  - nowatchdog

# How the declaration meets the line the machine already has.
#
#   append   (default) keep every existing option and add the declared ones.
#   replace  the declared list becomes the whole line.
#
# `append` is the default because the line carries more than hardening: a laptop
# needs its hardware workarounds, and a replace would drop them at the next boot --
# an unreadable screen, or a suspend that stops working. A server that owns its
# boot entirely sets `replace`. This product ships a boot splash, so `append` is
# the only mode whose result is the declared line plus the installer's.
# An option already present under another spelling is matched by its key
# (`quiet`, `init_on_alloc=1`) and is not appended twice.
hardening_cmdline_mode: append
