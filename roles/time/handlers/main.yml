---
- name: Restart chrony
  ansible.builtin.systemd_service:
    name: "{{ time_server_package }}"
    state: restarted
  when: not ansible_check_mode

- name: Restart timesyncd
  ansible.builtin.systemd_service:
    name: "{{ time_client_package }}"
    state: restarted
  when: not ansible_check_mode
