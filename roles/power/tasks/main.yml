---
# The power policy: hibernation is disabled unless the site enables it.
#
# The role reads its own change back. Writing the sleep drop-in and masking the
# targets is the declaration; logind's answer and a refused `systemctl hibernate`
# are the proof. In `enabled` mode the proof is a real hibernate and resume at
# the console: this role never hibernates the machine and never writes GRUB.

- name: The host uses systemd
  ansible.builtin.assert:
    that:
      - ansible_facts.service_mgr == 'systemd'
    fail_msg: "{{ inventory_hostname }} does not use systemd."

- name: The sleep drop-in path is absolute
  # The parent directory task below runs as root: a relative value would make it
  # manage the remote working directory as a directory, and `..` could make it
  # manage `/`.
  ansible.builtin.assert:
    that:
      - power_sleep_conf is match('^/')
      - power_sleep_conf is not search('\.\.(/|$)')
    fail_msg: >-
      {{ inventory_hostname }}: power_sleep_conf must be an absolute path
      without `..`, not `{{ power_sleep_conf }}`.

# The preconditions of `enabled` are read BEFORE anything is written: a host
# whose running kernel was not booted with `resume=` is left untouched, and the
# message says which boot it waits for.
- name: The site declares the device hibernation resumes from
  # A swap UUID or a stable `/dev` path, and nothing else: the value is written
  # into a file the initramfs sources as root, so a newline, a `$(...)`, a
  # backtick or a quote is refused here instead of reaching the boot.
  ansible.builtin.assert:
    that:
      - >-
        power_resume_device
        is match('^(UUID=[0-9A-Fa-f-]+|/dev/[A-Za-z0-9._/-]+)\Z')
    fail_msg: >-
      {{ inventory_hostname }}: power_hibernation is `enabled` and
      power_resume_device is empty or not a swap device (`UUID=...` or
      `/dev/...`). Declare the device the kernel resumes from.
  when: power_hibernation == 'enabled'

- name: The site accepts the unencrypted-swap risk
  # Unconditional in `enabled` mode, including on the run that refuses the host:
  # the risk is the site's decision, and the operator must see it stated.
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: hibernation is ENABLED by the site. A hibernation
      image is the whole memory of this host written to swap, and this product
      does not encrypt the swap: unless the site's own layer encrypts it, every
      secret the machine holds at that instant is written in clear to disk. This
      is an accepted risk, not a security property. The proof is a real
      hibernate and resume at the console; a `--check` proves nothing here.
  when: power_hibernation == 'enabled'

- name: The declared kernel command line is read
  ansible.builtin.slurp:
    src: "{{ power_grub_default }}"
  register: power_grub_read
  when:
    - power_hibernation == 'enabled'
    - not ansible_check_mode

- name: The kernel line declares the resume device
  # The quotes are replaced by spaces before the split: `update-grub` writes the
  # last option against the closing quote, and that quote is not part of the
  # option. The whole file is searched, so a commented `resume=` would match
  # too; the `/proc/cmdline` assert below is the effective check.
  ansible.builtin.assert:
    that:
      - >-
        ("resume=" ~ power_resume_device)
        in ((power_grub_read.content | b64decode) | replace('"', ' ') | split())
    fail_msg: >-
      {{ inventory_hostname }}: `{{ power_grub_default }}` does not carry
      `resume={{ power_resume_device }}`. Add it to `hardening_kernel_cmdline`
      (that role owns GRUB), converge, and reboot.
  when:
    - power_hibernation == 'enabled'
    - not ansible_check_mode

- name: The running kernel command line is read
  ansible.builtin.slurp:
    src: /proc/cmdline
  register: power_cmdline_read
  when:
    - power_hibernation == 'enabled'
    - not ansible_check_mode

- name: The running kernel was booted to resume from the declared device
  # Exact token, not a substring: `resume=UUID=` must not match a longer UUID.
  ansible.builtin.assert:
    that:
      - >-
        ("resume=" ~ power_resume_device)
        in ((power_cmdline_read.content | b64decode).split())
    fail_msg: >-
      {{ inventory_hostname }}: the running kernel was booted without
      `resume={{ power_resume_device }}`, so a hibernation image would have no
      device to resume from. The declaration belongs to `hardening_kernel_cmdline`
      and takes effect at the next boot: reboot and run the play again.
      Hibernation is not enabled before the kernel resumes from the declared
      device.
  when:
    - power_hibernation == 'enabled'
    - not ansible_check_mode

- name: The sleep drop-in directory exists
  # `template` fails when the destination directory is absent (measured on
  # ansible-core 2.19) while `--check` reports the change without creating it:
  # the dry run would be green and the converge would fail.
  ansible.builtin.file:
    path: "{{ power_sleep_conf | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# The image is rebuilt BEFORE hibernation is declared: a file on disk that the
# boot image does not carry is not a resume configuration, and a failed later
# task must not leave hibernation enabled over the previous image.
- name: The power state directory exists
  ansible.builtin.file:
    path: "{{ power_initramfs_marker | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: The initramfs rebuild marker is read
  ansible.builtin.slurp:
    src: "{{ power_initramfs_marker }}"
  register: power_marker_read
  failed_when: false
  when:
    - power_hibernation == 'enabled'
    - not ansible_check_mode

- name: The initramfs rebuild is requested when its marker disagrees
  # The resume template only notifies on a CHANGE; a failed `update-initramfs`
  # leaves the template unchanged and the marker stale, so the rebuild would
  # never be retried. This kick asks for the handler whenever the marker does
  # not name the declared device.
  ansible.builtin.command:
    cmd: /bin/true
  changed_when: true
  notify: Rebuild the initramfs
  when:
    - power_hibernation == 'enabled'
    - not ansible_check_mode
    - (power_marker_read.content | default('') | b64decode | trim) != power_resume_device

- name: The initramfs resume configuration is declared
  # A switch back to `disabled` removes the role's OWN file (recognised by its
  # SPDX header, see below) and rebuilds the image; a file the installer wrote
  # stays, and the kernel line remains the site's.
  ansible.builtin.template:
    src: resume.j2
    dest: /etc/initramfs-tools/conf.d/resume
    owner: root
    group: root
    mode: "0644"
  notify: Rebuild the initramfs
  when: power_hibernation == 'enabled'

- name: The initramfs is rebuilt before hibernation is declared
  # `meta: flush_handlers` runs a notified handler now instead of at the end of
  # the play, where a later failure would lose it: on the next run the resume
  # template is unchanged, the marker is read, and the kick asks for the
  # rebuild again. The guard keeps the default mode from reordering other
  # roles' pending handlers.
  ansible.builtin.meta: flush_handlers
  when: power_hibernation == 'enabled'

- name: The role's resume configuration is read when hibernation is disabled
  ansible.builtin.slurp:
    src: /etc/initramfs-tools/conf.d/resume
  register: power_resume_read
  failed_when: false
  when:
    - power_hibernation == 'disabled'
    - not ansible_check_mode

- name: The role's own resume configuration is removed when hibernation is disabled
  # The installer's file carries no SPDX header and stays; the role's own file
  # is removed and the image rebuilt, so a re-enabled site does not resume from
  # a stale image.
  ansible.builtin.file:
    path: /etc/initramfs-tools/conf.d/resume
    state: absent
  notify: Rebuild the initramfs
  when:
    - power_hibernation == 'disabled'
    - not ansible_check_mode
    - "'SPDX-License-Identifier: AGPL-3.0-or-later' in (power_resume_read.content | default('') | b64decode)"

- name: The sleep policy is declared
  ansible.builtin.template:
    src: sleep.conf.j2
    dest: "{{ power_sleep_conf }}"
    owner: root
    group: root
    mode: "0644"

- name: The hibernation targets are masked when hibernation is disabled
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    masked: true
  loop:
    - hibernate.target
    - hybrid-sleep.target
    - suspend-then-hibernate.target
  when: power_hibernation == 'disabled'

- name: The hibernation targets are unmasked when the site enables hibernation
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    masked: false
  loop:
    - hibernate.target
    - hybrid-sleep.target
    - suspend-then-hibernate.target
  when: power_hibernation == 'enabled'

- name: The hibernation targets are read back
  ansible.builtin.command:  # noqa: command-instead-of-module
    cmd: systemctl is-enabled {{ item }}
  loop:
    - hibernate.target
    - hybrid-sleep.target
    - suspend-then-hibernate.target
  register: power_target_states
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: The hibernation targets are in the state the policy declares
  # `masked-runtime` is a mask too (it disappears at the next boot): the enabled
  # read-back rejects it, or a runtime mask would survive `systemctl unmask`.
  # The exit code is checked as well: an empty answer must not pass the
  # `not in` test.
  ansible.builtin.assert:
    that:
      - >-
        (power_hibernation == 'disabled'
         and (item.stdout | trim) in ['masked', 'masked-runtime'])
        or (power_hibernation == 'enabled'
            and (item.rc | int) == 0
            and (item.stdout | trim) not in ['masked', 'masked-runtime'])
    fail_msg: >-
      {{ inventory_hostname }}: {{ item.item }} answers
      `{{ item.stdout | trim }}` (rc {{ item.rc }}), not the state
      power_hibernation `{{ power_hibernation }}` declares.
  loop: "{{ power_target_states.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: not ansible_check_mode

# `CanHibernate` is a METHOD of `org.freedesktop.login1.Manager`, not a property
# of the systemd manager: `systemctl show -p CanHibernate` prints nothing and
# exits 0 (measured on systemd 257). This is the same check `systemctl hibernate`
# makes before it hibernates (`Manager.Hibernate` re-runs it), and logind parses
# the sleep files on every request, so the answer reflects the drop-in above.
- name: The sleep verb logind offers is read
  ansible.builtin.command:  # noqa: command-instead-of-module
    cmd: >-
      busctl call org.freedesktop.login1 /org/freedesktop/login1
      org.freedesktop.login1.Manager CanHibernate
  register: power_can_hibernate
  changed_when: false
  when: not ansible_check_mode

- name: Logind offers the sleep verb the policy declares
  # `AllowHibernation=no` is read BEFORE any swap check, so `disabled` must
  # answer `no` exactly; `na` would mean the drop-in is overridden or unreadable.
  ansible.builtin.assert:
    that:
      - >-
        (power_hibernation == 'disabled'
         and (power_can_hibernate.stdout | trim) == 's "no"')
        or (power_hibernation == 'enabled'
            and (power_can_hibernate.stdout | trim) in ['s "yes"', 's "challenge"'])
    fail_msg: >-
      {{ inventory_hostname }}: logind answers
      `{{ power_can_hibernate.stdout | trim }}` for CanHibernate, which
      contradicts `power_hibernation: {{ power_hibernation }}`. In `disabled`
      mode the answer must be `no`, and a drop-in numbered higher than
      `{{ power_sleep_conf }}` can override it (read `/etc/systemd/sleep.conf.d/`).
      In `enabled` mode `na` means logind finds no usable swap or resume device
      for the declared `power_resume_device`.
  when: not ansible_check_mode

- name: The suspend-then-hibernate verb logind offers is read
  ansible.builtin.command:  # noqa: command-instead-of-module
    cmd: >-
      busctl call org.freedesktop.login1 /org/freedesktop/login1
      org.freedesktop.login1.Manager CanSuspendThenHibernate
  register: power_can_suspend_then_hibernate
  changed_when: false
  when: not ansible_check_mode

- name: Logind does not offer suspend-then-hibernate when the policy disables it
  ansible.builtin.assert:
    that:
      - (power_can_suspend_then_hibernate.stdout | trim) in ['s "no"', 's "na"']
    fail_msg: >-
      {{ inventory_hostname }}: logind answers
      `{{ power_can_suspend_then_hibernate.stdout | trim }}` for
      CanSuspendThenHibernate while `power_hibernation: disabled`. A drop-in
      numbered higher than `{{ power_sleep_conf }}` can re-enable it.
  when:
    - not ansible_check_mode
    - power_hibernation == 'disabled'

# The assert above requires `no`, so this probe cannot hibernate the machine:
# `Manager.Hibernate` re-runs the same sleep-config check and answers "disabled
# by config" (`SLEEP_DISABLED`) before it does anything.
- name: Hibernation is attempted and refused
  ansible.builtin.command:  # noqa: command-instead-of-module
    cmd: systemctl hibernate
  register: power_hibernate_probe
  changed_when: false
  failed_when: false
  when:
    - not ansible_check_mode
    - power_hibernation == 'disabled'
    - power_can_hibernate.stdout | trim == 's "no"'

- name: The refused hibernation is what the policy claims
  ansible.builtin.assert:
    that:
      - power_hibernate_probe.rc | default(1) | int != 0
    fail_msg: >-
      {{ inventory_hostname }}: `systemctl hibernate` answered rc 0 while
      hibernation is disabled, so the policy is not in force.
  when:
    - not ansible_check_mode
    - power_hibernation == 'disabled'
    - power_can_hibernate.stdout | trim == 's "no"'

- name: The console proof is stated
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: the declaration is applied. It is proved only by
      a real hibernate and resume at the console (`systemctl hibernate`, power
      on, then `journalctl -b`); a converge or a `--check` does not prove it.
  when: power_hibernation == 'enabled'
