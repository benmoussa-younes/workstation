---
- name: Apply the kernel settings
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: true
  when: not ansible_check_mode

- name: Apply the tmpfiles
  ansible.builtin.command:
    cmd: systemd-tmpfiles --create {{ performance_tmpfiles_file }}
  changed_when: true
  when: not ansible_check_mode

# The provider override is a unit that only takes effect when systemd re-reads
# it, and the new bus only starts at the next boot: a reload is what makes the
# next boot use the chosen provider, and it does not disturb the running one.
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: not ansible_check_mode
