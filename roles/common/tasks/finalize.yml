---
# The end-of-play services. `common` runs first, but `gnome`/`printing` install
# packages whose Recommends bring `avahi-daemon`; this file runs in `post_tasks`,
# after every package the desktop declares.
#
# Avahi is LEFT RUNNING when `common_avahi_enabled` is true (the default): the
# GNOME Add Printer panel enumerates the network printers through the CUPS
# `dnssd` backend, which needs it. The unit, its socket, the systemd alias and
# the D-Bus activation file are all made live. A site that refuses mDNS sets the
# variable false and the role retires them as before.

- name: Whether the Avahi daemon is installed is known
  ansible.builtin.stat:
    path: /usr/sbin/avahi-daemon
  register: common_avahi_present

# The service is `TriggeredBy=avahi-daemon.socket`: starting it while the
# socket is still masked fails with "Unit avahi-daemon.socket is masked". The
# masks come off BOTH units first, then the socket starts the service.
- name: The Avahi units are unmasked
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    masked: false
  loop:
    - avahi-daemon.socket
    - avahi-daemon.service
  when:
    - common_avahi_enabled | bool
    - common_avahi_present.stat.exists
    - not ansible_check_mode

- name: The Avahi daemon runs for the printer discovery
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - avahi-daemon.socket
    - avahi-daemon.service
  when:
    - common_avahi_enabled | bool
    - common_avahi_present.stat.exists
    - not ansible_check_mode

# The unit's `[Install] Alias=dbus-org.freedesktop.Avahi.service` is the name
# the D-Bus activation point uses. The retirement wrote a `/dev/null` symlink
# there; the live state points at the unit itself. The link is DECLARED, not
# removed: an `absent` followed by `enable` would change on every converge.
- name: The Avahi unit alias points at the daemon
  ansible.builtin.file:
    src: /usr/lib/systemd/system/avahi-daemon.service
    dest: /etc/systemd/system/dbus-org.freedesktop.Avahi.service
    state: link
    force: true
  when:
    - common_avahi_enabled | bool
    - common_avahi_present.stat.exists
    - not ansible_check_mode
  notify: Reload systemd

# The activation file was diverted by the retirement; restoring it renames the
# package's own copy back. `removes` makes the task idempotent: it runs only
# while the diverted copy exists.
- name: The Avahi D-Bus activation file is restored
  ansible.builtin.command:  # noqa: command-instead-of-module
    cmd: >-
      dpkg-divert --local --rename --remove
      /usr/share/dbus-1/system-services/org.freedesktop.Avahi.service
  args:
    removes: /usr/share/dbus-1/system-services/org.freedesktop.Avahi.service.distrib
  when:
    - common_avahi_enabled | bool
    - common_avahi_present.stat.exists
    - not ansible_check_mode

- name: The Avahi bus activation path is read back
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /etc/systemd/system/dbus-org.freedesktop.Avahi.service
    - /usr/share/dbus-1/system-services/org.freedesktop.Avahi.service
  register: common_avahi_live
  when:
    - common_avahi_enabled | bool
    - common_avahi_present.stat.exists
    - not ansible_check_mode

- name: The Avahi daemon state is read
  ansible.builtin.command:  # noqa: command-instead-of-module
    cmd: systemctl is-active avahi-daemon.service
  register: common_avahi_active
  changed_when: false
  failed_when: false
  when:
    - common_avahi_enabled | bool
    - common_avahi_present.stat.exists
    - not ansible_check_mode

- name: The Avahi bus activation path is live and the daemon runs
  ansible.builtin.assert:
    that:
      - >-
        common_avahi_live.results[0].stat.lnk_source | default('')
        == '/usr/lib/systemd/system/avahi-daemon.service'
      - common_avahi_live.results[1].stat.exists
      - common_avahi_active.stdout | trim == 'active'
    fail_msg: >-
      {{ inventory_hostname }}: the GNOME Add Printer panel cannot enumerate the
      network printers. The alias is
      `{{ common_avahi_live.results[0].stat.lnk_source | default('absent') }}`,
      the activation file
      {{ 'exists' if common_avahi_live.results[1].stat.exists else 'is gone' }},
      and the daemon is `{{ common_avahi_active.stdout | trim }}`.
  when:
    - common_avahi_enabled | bool
    - common_avahi_present.stat.exists
    - not ansible_check_mode

# The false path: the retirement, kept for a site that refuses mDNS.
- name: The Avahi daemon is retired when the site refuses mDNS
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    masked: true
  loop:
    - avahi-daemon.service
    - avahi-daemon.socket
  when:
    - not (common_avahi_enabled | bool)
    - common_avahi_present.stat.exists
    - not ansible_check_mode

- name: The Avahi unit alias is masked when the site refuses mDNS
  ansible.builtin.file:
    src: /dev/null
    dest: /etc/systemd/system/dbus-org.freedesktop.Avahi.service
    state: link
    force: true
  when:
    - not (common_avahi_enabled | bool)
    - common_avahi_present.stat.exists
    - not ansible_check_mode
  notify: Reload systemd

- name: The Avahi D-Bus activation file is diverted when the site refuses mDNS
  ansible.builtin.command:  # noqa: command-instead-of-module
    cmd: >-
      dpkg-divert --local --rename --add
      /usr/share/dbus-1/system-services/org.freedesktop.Avahi.service
    creates: /usr/share/dbus-1/system-services/org.freedesktop.Avahi.service.distrib
  when:
    - not (common_avahi_enabled | bool)
    - common_avahi_present.stat.exists
    - not ansible_check_mode

- name: The Avahi bus activation path is read back when the site refuses mDNS
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /etc/systemd/system/dbus-org.freedesktop.Avahi.service
    - /usr/share/dbus-1/system-services/org.freedesktop.Avahi.service
  register: common_avahi_retired
  when:
    - not (common_avahi_enabled | bool)
    - common_avahi_present.stat.exists
    - not ansible_check_mode

- name: The Avahi bus activation path is retired
  ansible.builtin.assert:
    that:
      - common_avahi_retired.results[0].stat.lnk_source | default('') == '/dev/null'
      - not common_avahi_retired.results[1].stat.exists
    fail_msg: >-
      {{ inventory_hostname }}: a bus client can still ask Avahi to start.
      The alias is
      `{{ common_avahi_retired.results[0].stat.lnk_source | default('absent') }}`
      and the activation file
      {{ 'exists' if common_avahi_retired.results[1].stat.exists else 'is gone' }}.
  when:
    - not (common_avahi_enabled | bool)
    - common_avahi_present.stat.exists
    - not ansible_check_mode

# `geoclue` reaches for mDNS to fetch NMEA from a GPS on the local network
# (`[network-nmea]`). Avahi runs for the printer discovery, but a GPS on the LAN
# is not a printer: the source is declared off instead of being left to probe.
- name: Whether the location service has a configuration is known
  ansible.builtin.stat:
    path: "{{ common_geoclue_config }}"
  register: common_geoclue_present

- name: The location service does not look for a GPS on the local network
  # `ansible.builtin` has no INI module and this collection pins no other one
  # (see the diversion in `identity`). The pattern is scoped to the section:
  # `enable=true` also appears under `[3g]` and `[cdma]`, and those stay on.
  ansible.builtin.replace:
    path: "{{ common_geoclue_config }}"
    regexp: '(?m)(\[network-nmea\]\n(?:(?!^\[).*\n)*?)enable=true'
    replace: '\1enable=false'
    mode: "0644"
  when:
    - common_geoclue_present.stat.exists
    - not ansible_check_mode
  notify: Restart geoclue
