---
# `/etc/os-release` is rebranded by the `identity` role, so Ansible stops
# reporting `os_family == 'Debian'` after the first run. The Debian marker that
# branding never touches is `/etc/debian_version`.
- name: The Debian base is present
  ansible.builtin.stat:
    path: /etc/debian_version
  register: common_debian_release

- name: The Debian release marker is read
  ansible.builtin.slurp:
    src: /etc/debian_version
  register: common_debian_release_content

# The host is a supported platform. `/etc/debian_version` is the marker read:
# the `identity` role replaces `/etc/os-release`, so `ansible_distribution` stops
# naming Debian after the first converge.
- name: The host is a supported platform
  ansible.builtin.assert:
    that:
      - common_debian_release.stat.exists
      - (common_debian_release_content.content | b64decode | trim).split('.')[0] is match('^[0-9]+$')
      - ansible_facts.architecture == 'x86_64'
      - ansible_facts.python.version.major | int >= 3
    fail_msg: >-
      {{ inventory_hostname }} is not the Debian amd64 base this
      product supports.

- name: The baseline packages are present
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    cache_valid_time: 3600

# What `tasksel standard` and the installer leave behind is not always wanted.
# The list is declared, justified in defaults, and checked here on every run.
#
# DIVERGENCE FROM the Server collection: the server also
# purges `bluez`/`bluetooth` and masks `bluetooth.service`. A workstation keeps
# the Bluetooth stack -- the GNOME panel has no Bluetooth entry without it -- so
# neither the purge nor the mask is duplicated here. The `hardening` role no
# longer blacklists its kernel modules either; see roles/hardening/defaults.
- name: The packages this product does not want are absent
  ansible.builtin.apt:
    name: "{{ common_absent_packages }}"
    state: absent
    purge: true
    # The server role autoremoved here. On a desktop that is a trap: the
    # migration of the proof host showed that an autoremove proposes the kernel and
    # the desktop's own libraries. This product removes the packages it NAMES and
    # leaves every other removal to the operator.
    autoremove: false

# `state=absent` removes a package; it does not stop the next `apt install`, and
# an extension switch is exactly what someone installs to get a tray icon back.
# The refusal is therefore declared where apt reads it.
- name: The refused packages are declared to apt
  ansible.builtin.template:
    src: 90-workstation-refused.pref.j2
    dest: "{{ common_refused_pin_file }}"
    owner: root
    group: root
    mode: "0644"
  when: common_refused_packages | length > 0

# An empty list is the site's opt-out: no refusal file may outlive the decision,
# or apt would keep refusing a package the site just declared it wants.
- name: No refusal file outlives an empty list
  ansible.builtin.file:
    path: "{{ common_refused_pin_file }}"
    state: absent
  when: common_refused_packages | length == 0

# Read back twice, because neither answer is enough alone. `apt-get -s` answers
# rc 100 both for "no installable version" and for a package apt cannot locate at
# all; `apt-cache policy` shows the pin itself, every version line ending with its
# priority. A `-1` there is the refusal in force.
- name: The apt policy of the refused packages is read
  ansible.builtin.command:
    cmd: apt-cache policy {{ item }}
  loop: "{{ common_refused_packages }}"
  loop_control:
    label: "{{ item }}"
  register: common_refused_policy
  changed_when: false
  when: not ansible_check_mode

- name: Every refused package is pinned below installable
  ansible.builtin.assert:
    that:
      - item.stdout is search('(?m)^ +[^ ]+ -1$')
    fail_msg: >-
      {{ inventory_hostname }}: `apt-cache policy {{ item.item }}` shows no
      version with priority -1, so the refusal in {{ common_refused_pin_file }}
      is not in force, or apt knows no version for the package at all. The file
      needs its `.pref` suffix, a blank line between records and
      `Pin-Priority: -1`.
  loop: "{{ common_refused_policy.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not ansible_check_mode

- name: The refused packages are asked of apt
  ansible.builtin.command:  # noqa: command-instead-of-module
    cmd: apt-get -s install {{ item }}
  loop: "{{ common_refused_packages }}"
  loop_control:
    label: "{{ item }}"
  register: common_refused_simulation
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

# The pin above is the mechanism; this is what a person sees when they type
# `apt install`.
- name: The refused packages have no installable version
  ansible.builtin.assert:
    that:
      - item.rc == 100
    fail_msg: >-
      {{ inventory_hostname }}: `apt-get -s install {{ item.item }}` answers rc
      {{ item.rc }} instead of 100 (no installable version). Read
      {{ common_refused_pin_file }}: without its `Pin-Priority: -1` entry, apt
      resolves the package again.
  loop: "{{ common_refused_simulation.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not ansible_check_mode

# The extension set is empty and locked by `dconf`; an extension package found
# here is drift, not a setting. Named so a converge reports it instead of a
# session discovering it. A site that declares an extension removes it from
# `common_absent_packages`, which removes it from this check too.
#
# `dpkg-query -W` also answers for packages dpkg knows but has never installed
# (state `un`), so the status column is read: only `ii` is installed.
- name: The installed extension packages are read
  ansible.builtin.command:
    cmd: dpkg-query -W -f='${db:Status-Abbrev}${Package}\n' 'gnome-shell-extension-*'
  register: common_extension_packages
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: The extension packages this product removes are listed
  ansible.builtin.set_fact:
    common_extension_packages_installed: >-
      {{ common_extension_packages.stdout_lines | default([])
         | select('match', '^ii ') | map('regex_replace', '^ii +', '') | list
         | intersect(common_absent_packages) }}
  when: not ansible_check_mode

- name: No extension package this product removes is installed
  ansible.builtin.assert:
    that:
      - common_extension_packages.rc | int in [0, 1]
      - common_extension_packages_installed | length == 0
    fail_msg: >-
      {{ inventory_hostname }} has {{ common_extension_packages_installed }}
      installed. This product ships no GNOME Shell extension: GNOME Shell 48 has
      no tray host of its own, and the session cannot enable or install one
      (`disable-user-extensions` and `allow-extension-installation` are locked).
      Remove it, or make the site's decision explicit in `dconf_extensions`,
      `applications_extension_uuids` and `common_absent_packages`.
  when: not ansible_check_mode

# The server masks the Bluetooth daemon with a symlink to /dev/null. A desktop
# needs the daemon: GNOME Settings has no Bluetooth page without `bluez`, and a
# mask that survives the conversion cannot be lifted by installing the package.
# Only the server's own symlink is removed; a site's regular unit file is left
# alone and the read-back later reports it.
- name: The Bluetooth mask of the server is read
  ansible.builtin.stat:
    path: /etc/systemd/system/bluetooth.service
  register: common_bluetooth_mask

- name: The server's Bluetooth mask is withdrawn
  ansible.builtin.file:
    path: /etc/systemd/system/bluetooth.service
    state: absent
  when:
    - common_bluetooth_mask.stat.exists
    - common_bluetooth_mask.stat.islnk | default(false)
    - common_bluetooth_mask.stat.lnk_target | default('') == '/dev/null'
  notify: Reload systemd

# The editor a session gets. `nano` is the only editor the product installs, and
# several tools read `EDITOR` before they look for `vi`: `sudo -e`, `visudo`,
# `systemctl edit`, `crontab -e`, `git commit`. Declaring it here means none of
# them depends on an editor that is not installed.
- name: The default editor is declared
  ansible.builtin.copy:
    content: |
      # Managed by Ansible: the system's editor. `nano` is the only one installed.
      EDITOR=nano
      VISUAL=nano
    dest: /etc/profile.d/10-workstation-editor.sh
    owner: root
    group: root
    mode: "0644"

- name: The default editor is set for every session
  # `/etc/environment` belongs to the distribution: a line is ensured, the file
  # is not rewritten.
  ansible.builtin.lineinfile:
    path: /etc/environment
    regexp: '^EDITOR='
    line: 'EDITOR=nano'
    state: present
    create: true
    owner: root
    group: root
    mode: "0644"

- name: The root shell gets the editor too
  ansible.builtin.lineinfile:
    path: /root/.bashrc
    regexp: '^export EDITOR='
    line: 'export EDITOR=nano'
    state: present
    create: true
    mode: "0600"

# systemd's ssh-generator offers ssh over AF_VSOCK and an AF_UNIX socket. The
# product uses neither, and on a machine whose vsock is not ready that early it
# logs a failure on every boot (a race: the generator runs at ~2.1s, the CID is
# assigned later). Masking it removes two unused access paths and the noise.
- name: The generator override directory exists
  ansible.builtin.file:
    path: /etc/systemd/system-generators
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: The unused ssh access paths are masked
  ansible.builtin.file:
    src: /dev/null
    dest: /etc/systemd/system-generators/systemd-ssh-generator
    state: link
    force: true

- name: The AF_UNIX ssh listener is not wanted
  ansible.builtin.systemd_service:
    name: sshd-unix-local.socket
    state: stopped
    enabled: false
  failed_when: false

# The installer can leave a superseded kernel behind, and `apt autoremove` does
# not reclaim it (measured: `autoremove` reported nothing while two kernels were
# installed). Purge every kernel but the running one, and keep the metapackage.
- name: The installed kernel packages are read
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      dpkg-query -W -f='${Package}\n' 'linux-image-[0-9]*' | grep -v -- '-unsigned' | sort -V
    executable: /bin/bash
  register: common_kernels
  changed_when: false

# Keep the RUNNING kernel and the NEWEST installed (the security update waiting
# for a reboot). The earlier version purged everything but the running one, so a
# freshly installed security kernel was removed on the NEXT converge and the
# fix was lost. Only genuinely superseded kernels are purged.
- name: The kernels to purge are decided
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      all=$(dpkg-query -W -f='${Package}\n' 'linux-image-[0-9]*' | grep -v -- '-unsigned' | sort -V) &&
      newest=$(printf '%s\n' "$all" | tail -1) &&
      printf '%s\n' "$all" | grep -v -x -e "linux-image-$(uname -r)" -e "$newest" || true
    executable: /bin/bash
  register: common_superseded_kernels
  changed_when: false

- name: Superseded kernels are purged
  ansible.builtin.apt:
    name: "{{ common_superseded_kernels.stdout_lines }}"
    state: absent
    purge: true
    autoremove: false
  when: common_superseded_kernels.stdout_lines | length > 0

- name: The configuration directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ common_directories }}"

# Avahi is configured in `finalize.yml`, at the end of the play: `gnome` and
# `printing` install packages whose Recommends bring `avahi-daemon`, and the
# daemon is enabled (or retired when the site refuses mDNS) after those installs.

# The periodic-upgrade mechanism, declared. The package is in
# `common_packages`; these two files are its declaration. `unattended-upgrades`
# performs the upgrades, the apt-daily timers only trigger it -- one mechanism,
# owned here.
- name: The periodic upgrade is enabled
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: "{{ common_auto_upgrades_file }}"
    owner: root
    group: root
    mode: "0644"

- name: What the periodic upgrade may install is declared
  ansible.builtin.template:
    src: 50unattended-upgrades.j2
    dest: "{{ common_unattended_upgrades_file }}"
    owner: root
    group: root
    mode: "0644"

# sysstat's collection is driven by systemd timers, and `/etc/default/sysstat`
# ships `ENABLED="false"`: the timers run and collect NOTHING (audit). Declare it
# on, AND enable the timers -- Debian's package leaves them DISABLED (preset
# enabled), so the flag alone records nothing. The earlier comment here claimed
# Debian enabled them; a fresh install from the day-0 baseline proved it wrong
# (P4, 2026-10-07).
#
# `create: true` because on a fresh machine the package is installed by the
# task above but a `--check` run only SIMULATES that install: the conffile does
# not exist yet, and `lineinfile` without `create` fails on the absent file
# even in check mode (measured on the proof host, 2026-10-21). On a real run the
# package has created the file, so `create` never fires.
- name: The system activity collector is enabled
  ansible.builtin.lineinfile:
    path: /etc/default/sysstat
    regexp: '^ENABLED='
    line: 'ENABLED="true"'
    create: true
    owner: root
    group: root
    mode: "0644"

# The package is installed by the task above, so the units exist on a real
# run -- but not in check mode, where the install is only reported. Starting
# them is therefore not simulated there.
- name: The system activity timers actually run
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - sysstat-collect.timer
    - sysstat-rotate.timer
    - sysstat-summary.timer
  when: not ansible_check_mode

# `sysstat.service` is what STARTS those three timers, and enabling the timers
# alone does not: they declare `WantedBy=sysstat.service`, so their enable links
# land in `sysstat.service.wants/` and nothing else -- while the packaged unit
# carries `[Install] WantedBy=multi-user.target` with `Also=` each timer.
# Measured on a converted host (2026-10-10): with the timers enabled and the service
# DISABLED, a reboot starts nothing, the three timers come up INACTIVE, and the
# next converge reports `changed` on all of them -- the finding
# `base-idempotence-across-reboot`. Enabling the SERVICE is the path the package
# documents, and it is what pulls them in at boot.
- name: The unit that starts them is enabled and started
  ansible.builtin.systemd_service:
    name: sysstat
    enabled: true
    state: started
  when: not ansible_check_mode
